name: PR Checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/iron'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # npm cache files are stored in `~/.npm` on Linux/macOS
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: prepare-rust
        # Toolchain, components (rustfmt/clippy) and the wasm32 target are pinned in
        # rust-toolchain.toml; the bare `rustup toolchain install` reads that file.
        run: |
          rustup toolchain install
          rustup show
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: install
        run: |
          npm install
      - name: rust:test
        run: |
          npm run rust:test
      - name: rust:build-nodejs
        run: |
          npm run rust:build-nodejs
      - name: rust:build-browser
        run: |
          npm run rust:build-browser
      - name: cargo-fmt
        run: cargo fmt --all -- --check
      - name: cargo-clippy
        # The gate (deny level + allow list) is defined once in ./clippy.sh — do not
        # restate lint flags here.
        run: ./clippy.sh
      - name: all:test
        run: cargo test
      - name: cml:install
        working-directory: cml/wasm
        run: npm install
      - name: cml:rust:build-nodejs
        working-directory: cml/wasm
        run: npm run rust:build-nodejs
      - name: cml:rust:build-browser
        working-directory: cml/wasm
        run: npm run rust:build-browser
      - name: multi-era:install
        working-directory: multi-era/wasm
        run: npm install
      - name: multi-era:rust:build-nodejs
        working-directory: multi-era/wasm
        run: npm run rust:build-nodejs
      - name: multi-era:rust:build-browser
        working-directory: multi-era/wasm
        run: npm run rust:build-browser
