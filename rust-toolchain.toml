[toolchain]
# Pinned so local, CI, and publish builds all use the same compiler (matches upstream
# dcSpark's pin). An unpinned `stable` lets new clippy lints break CI on old code and
# makes published wasm binaries irreproducible. Bump deliberately.
channel = "1.96.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
